# Configuration shared by both deployables without duplication, per PLAN.md Phase 8. The API and the
# prefetcher both read this one ConfigMap and this one Secret, so connection settings and credentials
# live in exactly one place. Values point at the in cluster infra Services by name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: truecost
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/truecost
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APICURIO_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
  TRUECOST_OSRM_BASE_URL: http://osrm:5000
  TRUECOST_EVENTS_ENABLED: "true"
  SPRING_PROFILES_ACTIVE: prod
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
  # Heap tracks the container memory limit rather than the host, so the limits below are honored.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: truecost
type: Opaque
stringData:
  # Development credentials for the in cluster exercise. A real cluster sources these from a sealed
  # secret or an external secret manager, never from a file in git.
  SPRING_DATASOURCE_USERNAME: truecost
  SPRING_DATASOURCE_PASSWORD: truecost
